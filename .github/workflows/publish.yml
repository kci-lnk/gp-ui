name: Publish npm

on:
  push:
    tags: ['v*']
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Use npm with Trusted Publishing support
        run: npm install --global npm@11.21.0 --ignore-scripts
      - name: Validate release tag and main history
        run: node scripts/release.mjs validate
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:demo
      - run: npm run build
      - name: Pack release artifact
        run: node scripts/release.mjs pack
      - name: Verify exact release artifact
        run: npm run verify:package -- .release/package.tgz
      - name: Publish verified artifact using OIDC
        run: node scripts/release.mjs publish
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: npm-package-${{ github.ref_name }}
          path: .release/package.tgz
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: publish-test-results
          path: test-results/
          retention-days: 7
